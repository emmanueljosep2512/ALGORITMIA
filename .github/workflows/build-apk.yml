name: Compilar APK de AlgoritmIA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar Proyecto Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Frontend (React + Vite)
        run: npm run build

      - name: Sincronizar con Capacitor
        run: npx cap sync

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: Instalar SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK (Gradle)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -200

      - name: Subir APK Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: algoritmia-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
